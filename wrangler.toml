# Cloudflare Pages configuration.
#
# THERE IS NO BUILD STEP. `pages_build_output_dir` points at the directory that is
# already committed and ready to serve. Cloudflare runs no build command, installs
# nothing, and compiles nothing. If a build command ever appears in the Pages
# project settings, something has gone wrong.
#
# Deploy:  npx wrangler pages deploy public --project-name glp1-fund
# Or let  .github/workflows/deploy.yml  do it on every push to main.
#
# Required secrets, held in GitHub Actions secrets and NEVER in this repository:
#   CLOUDFLARE_API_TOKEN   scoped to: Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID
#
# See docs/ops-runbook.md section 6 for the full procedure and the exact token
# scopes, and for why the token must not be committed.

name = "glp1-fund"
compatibility_date = "2026-07-30"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
# KV: the price-change alert list. The ONLY server-side state in the project.
#
# The Pages Function at functions/api/alerts.js reads this binding as env.ALERTS
# and stores exactly two fields per subscriber: an email address and a medication
# preference. It never receives, and has no field to receive, the visitor's dose
# or insurance situation -- those are health information and never leave the
# browser.
#
# Until the binding exists, the alert endpoint returns 503 and logs the missing
# binding -- see functions/api/alerts.js, which checks `env.ALERTS` before it
# touches anything. Every other part of the site is unaffected, which is the
# intended failure mode: a broken mailing list must never take down a page
# somebody is reading at a pharmacy counter.
#
# THE BLOCK BELOW IS COMMENTED OUT ON PURPOSE. Wrangler validates this file
# before it uploads anything, and it rejects an empty id:
#
#   "kv_namespaces[0]" bindings should have a string "id" field
#   but got {"binding":"ALERTS","id":"","preview_id":""}.
#
# Placeholder ids are not a thing here -- the field is either a real namespace
# or absent. An absent binding costs one endpoint; a malformed one costs the
# whole deploy, which is what it did before this was commented out.
#
# The production binding is configured in the Cloudflare dashboard instead
# (project > Settings > Bindings, variable name ALERTS), which is where Pages
# reads it from at runtime. Uncomment this only for `wrangler pages dev`, and
# only with real ids from:
#   npx wrangler kv namespace create ALERTS
#   npx wrangler kv namespace create ALERTS --preview
# ---------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "ALERTS"
# id = ""
# preview_id = ""
